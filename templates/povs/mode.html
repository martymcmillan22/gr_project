{% extends "base.html" %}

{% block title %}POVs - {{ mode_name }}{% endblock %}

{% block content %}
<section class="section">
  <div class="container">
    <a href="{% url 'povs-home' %}" class="button is-light mb-4">Back to POVs</a>

    <article class="message {{ mode_color }} is-light">
      <div class="message-header">
        <p>{{ mode_name }}</p>
      </div>
      <div class="message-body">
        <p>{{ mode_description }}</p>
        <p class="mt-3">This POV mode is now wired and ready for your next feature pass.</p>
      </div>
    </article>
  </div>
</section>
{% endblock %}
